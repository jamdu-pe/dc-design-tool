# ---------------------------------------------------------------------------
# 교체용 후보 (신규). 위 기본 블록보다 뒤에 둘 것 — 파일 상단 [순서 주의] 참고.
#
# 주의: "128x400G 단일 SKU"는 공개 자료에서 확인되지 않았다. 51.2T 급 스위치는
# 64x800G OSFP 가 표준 형상이며, 400G 는 OSFP 브레이크아웃으로 포트를 2배 늘려 쓴다.
# 따라서 400G 후보는 '브레이크아웃 구성'으로 등록하고 confidence: projected 로 둔다.
# ---------------------------------------------------------------------------

- id: leaf_nvidia_sn5600_64x800g
  type: network
  subtype: leaf
  vendor: NVIDIA
  model: Spectrum-4 SN5600
  interface:
    ports: 64                  # OSFP 64포트, 포트당 10/25/50/100/200/400/800G (확인)
    port_speed_gbps: 800
    rack_units: 2
    throughput_tbps: 51.2      # (확인)
    power_kw_typical: 0.94     # 통상 소비전력 940W (확인)
  as_of_date: "2026-08"
  confidence: vendor
  source_url: "https://networking-docs.nvidia.com/sn5000hw/specifications"

