# 랙 시스템 카탈로그 (레고 블록: type=rack)
# 수치는 공개자료 기반 개략치. 정밀설계 전 벤더 확정 필요.
- id: nvidia_gb200_nvl72
  type: rack
  vendor: NVIDIA
  model: GB200 NVL72
  interface:
    power_kw_typical: 120
    power_kw_peak: 132
    power_factor: 0.95
    cooling: liquid_d2c
    liquid_fraction: 0.85       # 약 85% 열을 액냉이 흡수(잔열 공냉)
    supply_water_c: 32
    rack_units: 48
    footprint_m2: 1.2
    weight_kg: 1360
    accel_count: 72             # Blackwell GPU
    scaleout_ports: 72
    port_speed_gbps: 800
    overhead_kw: 0.3            # 전원셸프·관리 네트워크 등 잔여 소비
  composed_of:                  # 18 x 컴퓨트 트레이(4 GPU) + 9 x NVLink 스위치 트레이
    - {id: nvidia_gb200_compute_tray, count: 18}
    - {id: nvidia_nvlink_switch_tray, count: 9}
  as_of_date: "2025-03"
  confidence: vendor
  source_url: "https://x.com/trendforce/status/1900050272568926560"

