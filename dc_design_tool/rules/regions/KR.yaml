# 대한민국 규격 팩 — 개념설계용 요약이다.
#
# 주의: 아래 값은 널리 통용되는 표준 전압·왜형률 기준을 개념설계 수준으로 정리한 것이며,
# 조문 번호까지 대조한 것이 아니다. 실시설계·인허가 시 KEC 원문과 한전 계통연계 기술기준,
# 관할 검토기관 요구사항으로 반드시 확인·교체할 것.
name: "대한민국 (KEC 기반)"
reference: "KEC 한국전기설비규정 / 한전 표준전압 / IEEE 519 (전류 왜형률)"

standards:
  primary_kv: [22.9, 154]    # 수전 표준전압(배전 22.9kV, 송전 154kV)
  lv_v: [380, 220]           # 저압 표준전압(3상 380V / 단상 220V)
  thd_i_limit: 0.05          # 계통 연계점 전류 왜형률 한계

overrides:                   # 파일명(확장자 제외) → 해당 규칙에 덮어쓸 값만 기술
  electrical:
    distribution:
      primary_kv: 22.9       # 국내 특고압 수전
      rack_voltage_v: 380    # 국내 3상 저압 표준(기본 415V 대신)
